name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # chak 5 min
  workflow_dispatch:        # pèmèt ou lanse li a la men

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: curl -s https://eduhaiti-wjx6.onrender.com > /dev/null
              curl -s https://eduhaiti-wjx6.onrender.com/health
              sleep 10
              curl -s https://eduhaiti-wjx6.onrender.com/api/health
